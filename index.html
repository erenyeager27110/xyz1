<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Girlfriend's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Poppins,sans-serif;
background:url("background.png") center/cover no-repeat fixed;
}
body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
}
.card{
position:relative;
z-index:2;
width:90%;
max-width:700px;
padding:30px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border-radius:25px;
color:#fff;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.4);
animation:fade 1.2s;
}
h1{
font-family:"Great Vibes",cursive;
font-size:58px;
color:#ffd8ea;
margin-bottom:10px;
}
h2{
font-weight:300;
margin-bottom:20px;
}
button{
margin-top:20px;
padding:14px 35px;
border:none;
border-radius:40px;
background:#ff4f93;
color:#fff;
font-size:18px;
cursor:pointer;
}
#letter{
display:none;
text-align:left;
line-height:1.8;
margin-top:25px;
white-space:pre-wrap;
}
#sign{
display:none;
margin-top:25px;
text-align:right;
font-family:"Great Vibes",cursive;
font-size:38px;
color:#ffd8ea;
}
@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="card">

<h1>Happy Girlfriend's Day ❤️</h1>

<h2>For My Dearest Esra</h2>

<p id="intro">
Every beautiful story begins with one special person.
</p>

<button id="open">Open My Heart ❤️</button>

<div id="letter"></div>

<div id="sign">
Forever Yours,<br>
Shahnawaz ❤️
</div>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const msg=`Dear Esra,

If you're reading this, 

I wanted to give you something more than just a text.

Thank you for making ordinary days feel brighter.

Your smile, your kindness, and your presence mean more to me than words can express.

Happy Girlfriend's Day ❤️

I hope this little surprise reminds you how special you are to me.

Forever Yours,
Shahnawaz ❤️`;

const btn=document.getElementById("open");
const intro=document.getElementById("intro");
const letter=document.getElementById("letter");
const sign=document.getElementById("sign");
const music=document.getElementById("music");

btn.onclick=()=>{
music.play().catch(()=>{});
btn.style.display="none";
intro.style.display="none";
letter.style.display="block";

let i=0;
(function type(){
if(i<msg.length){
letter.textContent+=msg.charAt(i++);
setTimeout(type,30);
}else{
sign.style.display="block";
}
})();
};
</script>

</body>
</html>
